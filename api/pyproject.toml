[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "screenshots", "app/scraper"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"app/scraper/**" = ["E", "F", "I", "B", "UP"]
"app/main.py" = ["I"]

[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
strict = false
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["app/scraper/", ".venv/"]

[[tool.mypy.overrides]]
module = "app.scraper.*"
ignore_errors = true
