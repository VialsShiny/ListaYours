version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      tooling:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
      day: monday
    groups:
      api-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directories:
      - /api
      - /frontend
      - /deploy/oracle
    schedule:
      interval: weekly
      day: monday
